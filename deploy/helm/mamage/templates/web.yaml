apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mamage.name" . }}-web
  labels:
    {{- include "mamage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  strategy:
    type: {{ .Values.web.strategy }}
    {{- if eq .Values.web.strategy "RollingUpdate" }}
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mamage
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: web
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/web-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: retain-hashed-assets
          image: {{ include "mamage.image" .Values.images.web | quote }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              for file in /usr/share/nginx/html/bundle.*; do
                [ -f "$file" ] || continue
                dest="/assets/$(basename "$file")"
                [ ! -e "$dest" ] || continue
                temp=$(mktemp /assets/.asset.XXXXXX)
                cp "$file" "$temp"
                chmod a+r "$temp"
                ln "$temp" "$dest" 2>/dev/null || [ -f "$dest" ]
                rm -f "$temp"
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources: {{ toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: assets, mountPath: /assets }
      containers:
        - name: web
          image: {{ include "mamage.image" .Values.images.web | quote }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command: [/bin/sh, -c, "sleep 5"]
          command: [nginx]
          args: [-g, "daemon off;"]
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 2
          resources: {{ toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf, readOnly: true }
            - { name: assets, mountPath: /var/cache/mamage-assets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: {{ include "mamage.name" . }}-web }
        - name: assets
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-webassets" (include "mamage.name" .)) .Values.persistence.webAssets.existingClaim | quote }}
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mamage.name" . }}-web
  labels:
    {{- include "mamage.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.serviceType }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: web
  ports: [{ name: http, port: 80, targetPort: http }]
