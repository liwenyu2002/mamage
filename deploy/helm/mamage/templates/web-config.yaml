apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mamage.name" . }}-web
  labels:
    {{- include "mamage.labels" . | nindent 4 }}
data:
  nginx.conf: |
    log_format mamage '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      access_log /dev/stdout mamage;
      client_max_body_size 5152m;
      client_body_timeout 3600s;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      location = /healthz { access_log off; return 200 'ok'; }
      location ~ ^/(api|uploads)(/|$) {
        proxy_pass http://{{ include "mamage.name" . }}-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }
      location ~ ^/bundle\.[a-zA-Z0-9_.-]+\.(js|css)(\.LICENSE\.txt)?$ {
        try_files $uri @historical_asset;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
      }
      location @historical_asset {
        root /var/cache/mamage-assets;
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
      }
      location = /index.html { add_header Cache-Control 'no-store' always; }
      location / { try_files $uri $uri/ /index.html; }
    }
